# Publishes @nascencestudio/tapestry to npm with provenance
# (a signed attestation linking each package to this workflow run and commit). ADR 0035.
#
# Runs when a GitHub release is published; stages the version, which goes live after a
# maintainer approves it on npmjs.com (2FA). Authentication:
# - First release: an `NPM_TOKEN` repository secret (granular, read and write for the scope).
# - Then: on npmjs.com, add this repository, `release.yml` and environment `npm` as the
#   package's **trusted publisher**, allowed actions: stage only (leave "npm publish" off);
#   delete the token and the secret.
# - Bump `version` in packages/tapestry/package.json and tag the release `v<version>`.
# (@nascencestudio/medialibrary is released from its own repository.)
#
# The same checks as CI run first; nothing is published if any of them fails.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package version
        run: |
          version="$(node -p "require('./packages/tapestry/package.json').version")"
          test "$version" = "${GITHUB_REF_NAME#v}" || { echo "packages/tapestry is $version, the release is $GITHUB_REF_NAME"; exit 1; }
      - run: pnpm lint
      - run: pnpm audit
      - run: pnpm --filter @nascencestudio/tapestry build
      - run: pnpm test
      # Staged: the version goes live only after a maintainer approves it with 2FA (npmjs.com or
      # `pnpm stage approve`). The trusted publisher keeps "allow npm publish" off, so a stolen
      # workflow identity can only stage, never release.
      - name: Stage the release
        run: pnpm --filter @nascencestudio/tapestry stage publish --provenance --access public --no-git-checks
        env:
          # First release only (a trusted publisher needs an existing package). Remove this,
          # the secret and the npm token once the trusted publisher is set up.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
